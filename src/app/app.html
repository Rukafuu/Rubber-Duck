<div
  class="app-shell min-h-screen bg-zinc-950 text-zinc-100 flex flex-col font-sans selection:bg-emerald-500/30 selection:text-emerald-200"
  [class.theme-light]="themeService.theme() === 'light'"
  [class.theme-dark]="themeService.theme() === 'dark'"
>
  <app-header (openNewSessionModal)="showGlobalNewModal.set(true)" />
  <app-secret-banner />
  <div class="flex-1 flex flex-col min-h-0">
    <router-outlet />
  </div>

  @if (showGlobalNewModal()) {
    <app-new-session-modal (modalClose)="showGlobalNewModal.set(false)" />
  }
</div>
